name: MVP CI/CD Pipeline

# dev: ejecuta las pruebas. main: pruebas, imagen en Docker Hub y despliegue en OCI.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Opcional: ID de la ejecución manual cuya red o VM quieres reutilizar"
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cypress install
      - name: Pruebas unitarias
        run: npm run test:unit
      - name: Pruebas de integración
        run: npm run test:integration
      - name: Pruebas E2E
        run: npm run test:e2e

  validar:
    name: Validar infraestructura antes del despliegue
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.4'
      - name: Verificar Terraform sin credenciales de Oracle
        run: |
          terraform fmt -check -recursive infra
          bootstrap=$(mktemp -d)
          cp -R infra/bootstrap/. "$bootstrap/"
          cp infra/oci/.terraform.lock.hcl "$bootstrap/"
          terraform -chdir="$bootstrap" init -backend=false -lockfile=readonly
          terraform -chdir="$bootstrap" test
          terraform -chdir=infra/oci init -backend=false -lockfile=readonly
          terraform -chdir=infra/oci validate
      - name: Comprobar los scripts y los playbooks
        run: |
          bash -n scripts/deploy-oci.sh
          python -m py_compile scripts/host-key-cache.py
          python3.12 -m venv "$RUNNER_TEMP/ansible-env"
          source "$RUNNER_TEMP/ansible-env/bin/activate"
          python -m pip install 'ansible-core~=2.20.0'
          ansible-playbook -i 'localhost,' --syntax-check infra/ansible/site.yml
          ansible-playbook -i 'localhost,' --syntax-check infra/ansible/dns.yml
      - name: Probar el contenedor con Caddy y SQLite
        run: |
          docker build -t gymturno:local .
          docker compose up -d --wait
          curl --retry 6 --retry-connrefused -fsS http://localhost/api/health | jq -e '.status=="ok"'
          curl -fsS http://localhost/ | grep -q GymTurno
          member='{"name":"Demo","email":"smoke@example.test","password":"SoloParaCI123","goal":"peso"}'
          curl -fsS -H 'Content-Type: application/json' -d "$member" http://localhost/api/register | jq -e '.member.name=="Demo"'
          docker compose up -d --force-recreate --wait app
          curl -fsS -H 'Content-Type: application/json' -d "$member" http://localhost/api/login | jq -e '.member.name=="Demo"'

  docker:
    name: Construir y publicar la imagen en Docker Hub
    needs: validar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/gymturno:latest
            ${{ vars.DOCKERHUB_USERNAME }}/gymturno:${{ github.sha }}

  deploy:
    name: Crear la VM con Terraform y configurarla con Ansible
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    concurrency:
      group: gymturno-production
      cancel-in-progress: false
    env:
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_TFVARS_JSON: ${{ secrets.OCI_TFVARS_JSON }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      GYM_VM_SSH_PUBLIC_KEY: ${{ vars.GYM_VM_SSH_PUBLIC_KEY }}
      GYM_DEPLOY_SSH_KEY: ${{ secrets.GYM_DEPLOY_SSH_KEY }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      GYM_PROJECT_DIR: /home/ubuntu/gymturno
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.4'
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Ansible y OCI CLI
        run: python -m pip install 'ansible-core~=2.20.0' 'oci-cli~=3.0'
      # Un clic en main aprovisiona una VM nueva. Un push actualiza producción.
      - name: Preparar el bucket y planificar la infraestructura de OCI
        run: bash scripts/deploy-oci.sh plan

      - name: Aplicar el plan y ejecutar Ansible
        env:
          APP_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/gymturno@${{ needs.docker.outputs.digest }}
        run: bash scripts/deploy-oci.sh apply

      - name: Quitar el acceso SSH temporal
        if: always()
        run: bash scripts/deploy-oci.sh cleanup
