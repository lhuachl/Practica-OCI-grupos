name: Pruebas de GymTurno
on:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cypress install
      - name: Ejecutar Cypress (unitarias, integración y E2E)
        run: npm test
